<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Avishkar Gaikwad — Data Analyst II at Honeywell Building Technologies. Data & AI, technical analytics, go-to-market strategy and commercial growth."
    />
    <meta name="author" content="Avishkar Gaikwad" />
    <meta property="og:title" content="Avishkar Gaikwad | Data Analyst II" />
    <meta
      property="og:description"
      content="Data & AI | Technical Analytics | GTM Strategy"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before React renders to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Avishkar Gaikwad | Data Analyst II</title>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>

  </body>
