<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F6F5" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Avishkar Gaikwad - Data Analyst II at Honeywell Building Technologies. Data & AI, technical analytics, go-to-market strategy and commercial growth."
    />
    <meta name="author" content="Avishkar Gaikwad" />
    <meta property="og:title" content="Avishkar Gaikwad | Data Analyst II" />
    <meta
      property="og:description"
      content="Data & AI | Technical Analytics | GTM Strategy"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme (or the system preference on a first visit) before anything renders.
      (function () {
        var t;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      /* Loading screen: styled inline so it shows before the app bundle arrives. */
      #preloader {
        --pl-bg: #0e0e0e;
        --pl-fg: #f5f5f5;
        --pl-muted: #b4b4b4;
        --pl-track: #2c2c2c;
        --pl-accent: #f5f5f5;
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--pl-bg);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      [data-theme="light"] #preloader {
        --pl-bg: #f6f6f5;
        --pl-fg: #111111;
        --pl-muted: #4a4a4a;
        --pl-track: #dedede;
        --pl-accent: #111111;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .pl__inner {
        width: min(320px, 80vw);
      }
      .pl__mark {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        color: var(--pl-fg);
        font-family: "Manrope", "Inter", sans-serif;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .pl__logo {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        font-size: 14px;
        font-weight: 800;
        color: var(--pl-bg);
        background: var(--pl-accent);
      }
      .pl__row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
        font-size: 13px;
        color: var(--pl-muted);
      }
      .pl__count {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 15px;
        color: var(--pl-fg);
        font-variant-numeric: tabular-nums;
      }
      .pl__track {
        height: 3px;
        border-radius: 3px;
        background: var(--pl-track);
        overflow: hidden;
      }
      .pl__bar {
        height: 100%;
        width: 100%;
        transform: scaleX(0);
        transform-origin: left;
        background: var(--pl-accent);
      }
    </style>
    <title>Avishkar Gaikwad | Data Analyst II</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="preloader" role="status" aria-live="polite">
      <div class="pl__inner">
        <div class="pl__mark"><span class="pl__logo">AG</span>Avishkar Gaikwad</div>
        <div class="pl__row"><span>Loading portfolio</span><span class="pl__count">0%</span></div>
        <div class="pl__track"><div class="pl__bar"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Counts up while the page loads, reaches 100% once everything is ready, then fades out.
      (function () {
        var el = document.getElementById("preloader");
        var count = el.querySelector(".pl__count");
        var bar = el.querySelector(".pl__bar");
        var shown = 0;
        var loaded = false;
        var start = Date.now();
        var timer = setInterval(function () {
          // Creep toward 90% while loading; finish once loaded (and shown for at least ~1s).
          var target = loaded && Date.now() - start > 1000 ? 100 : 90;
          shown = Math.min(target, shown + Math.max(0.6, (target - shown) * 0.06));
          count.textContent = Math.floor(shown) + "%";
          bar.style.transform = "scaleX(" + shown / 100 + ")";
          if (shown >= 100) {
            clearInterval(timer);
            setTimeout(function () {
              el.classList.add("is-done");
              window.__preloaderDone = true;
              window.dispatchEvent(new Event("preloader:done"));
              setTimeout(function () {
                if (el.parentNode) el.parentNode.removeChild(el);
              }, 600);
            }, 250);
          }
        }, 20);
        window.addEventListener("load", function () {
          loaded = true;
        });
      })();
    </script>
  </body>
</html>
